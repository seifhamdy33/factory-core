# .factory/config.toml: the optional factory overlay for this repo (factory-core spec: Overlay contract).
# Set only what differs from the core defaults shown in the comments. This file is a gate file (always T3).
project = "<repo-name>"                       # default: the GitHub repo name

# tests = ["tests/**", "test/**", "**/test_*.py", "**/*_test.py", "**/*.test.*", "**/*.spec.*"]
# acceptance_glob = "tests/acceptance/test_{issue}_*"
# specs_dir = "docs/specs"
# spec_name = "{issue}-{slug}.md"             # also {date} (YYYY-MM-DD)
# branch = "f/{issue}-{slug}"                 # also {type}, from the issue's type:<prefix> label
# branch_types = []                           # e.g. ["feat", "fix", "docs", "chore", "ops"]; first is the default
# worktree_root = "../{project}-worktrees"
# worktree_name = "{issue}-{slug}"
# quarantine = []                             # test ids no acceptance check may reference

[verify]
# fast_budget_s = 300
# cap_s = 600
# full_cap_s = 3600
# fast_locks = []
# full_locks = []                             # e.g. ["docker"] when --full needs the machine's only docker stack

[tiers]
# docs_globs = ["docs/**", "**/*.md"]          # can only narrow: a file is docs only if the core's globs match too
# sensitive = []                              # paths that make a change T3
# gate_extra = []                             # extra gate files (always T3)
# deps = []                                   # extra dependency manifests (T2), added to the core list in ci/tier.py

[integrity]
# threshold_globs = ["**/jest.config.*", "**/vitest.config.*", "**/.eslintrc*", "**/eslint.config.*",
#                    "**/tsconfig*.json", "**/.coveragerc", "**/.nycrc*"]
# assert = []                                 # extra regexes, added to the core lists in ci/integrity.py: removed
# skip = []                                   #   assertions, added skips and added suppressions in test files raise
# suppress = []                               #   to T2, e.g. assert = ['\bt\.(?:Error|Fatal)f?\(']  (Go)

[authority]
approver = ""                                 # the GitHub login whose spec-approved label counts (declared T3)
# auto_merge_ceiling = 0                      # the merger (factory-merger.yml) merges up to this tier; at most 1
# agents = []                                 # PR authors the merger accepts; default: the owner, claude[bot],
                                              #   factory-agent[bot]

# [mutation]                                  # absent by default; written by /factory:onboard; the score caps the merger's ceiling:
# score = 0                                   #   >= 60 -> T1, 40-59 -> T0, < 40 -> no auto-merge; absent -> T0
# date = "YYYY-MM-DD"
# tool = "mutmut 3.x"
# sample = []                                 # the modules the sample ran on

[coverage]                                    # the merger reads it from the repo's CI; missing or low -> T2 (G1)
# artifact = "coverage"                       # the artifact a successful pull_request run uploads
# path = "lcov.info"                          # the LCOV file inside it
# changed_lines_min = 80                      # percent of added code lines covered; can only be raised

[packet]
# max_lines = 40                              # at most 40
# extra = []                                  # extra headings, e.g. ["### Checklist"]

[packet.headings]
# intent = "## Intent"
# ac = "## Acceptance checks"
# changed = "## What changed"
# needs_you = "## Needs you"                  # decisions made for the owner, and deviations from the spec
# not_verified = "## Not verified"            # a heading without "Not verified" needs a "Not verified: ..." line
# rollback = "## Rollback"
